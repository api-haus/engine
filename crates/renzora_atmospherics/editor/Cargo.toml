[package]
name = "renzora_atmospherics_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_atmospherics: the weatherscape authoring tools. Registered via renzora::add!(.., Editor) and linked only by the editor bundle."

[dependencies]
bevy = { workspace = true }
renzora = { path = "../../renzora", default-features = false, features = ["editor"] }
renzora_atmospherics = { path = ".." }
bevy_atmospherics = { path = "../../../../crates/bevy_atmospherics" }

[lints]
workspace = true
